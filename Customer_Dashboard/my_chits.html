<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Chits | SK Chit Funds</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
theme:{
extend:{
colors:{
primary:"#004a99",
backgroundLight:"#f5f7f8"
}
}
}
}
</script>

</head>

<body class="bg-backgroundLight min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white hidden md:flex flex-col p-6">

<h2 class="text-2xl font-bold mb-10">SK Chit Funds</h2>

<nav class="flex flex-col gap-4 text-sm font-semibold">

<a href="dashboard.html" class="hover:bg-white/20 p-2 rounded">Dashboard</a>

<a href="my_chits.html" class="bg-white text-primary p-2 rounded font-bold">
My Chits
</a>

<a href="payments.html" class="hover:bg-white/20 p-2 rounded">Payments</a>

<a href="transaction.html" class="hover:bg-white/20 p-2 rounded">Transactions</a>

<a href="profile.html" class="hover:bg-white/20 p-2 rounded">Profile</a>

</nav>

<div class="mt-auto">

<button onclick="logout()"
class="w-full bg-white text-primary py-2 rounded-lg font-bold mt-10">
Logout
</button>

</div>

</aside>


<!-- MAIN CONTENT -->
<div class="flex-1 p-6 md:p-10">

<h1 class="text-3xl font-bold text-primary mb-8">
My Chit Details
</h1>

<!-- CHIT DETAILS CARD -->
<div class="bg-white rounded-xl shadow p-6 mb-8">

<div class="grid md:grid-cols-3 gap-6">

<div>
<p class="text-slate-500 text-sm">Customer ID</p>
<p id="customerId" class="text-lg font-bold"></p>
</div>

<div>
<p class="text-slate-500 text-sm">Customer Name</p>
<p id="customerName" class="text-lg font-bold"></p>
</div>

<div>
<p class="text-slate-500 text-sm">Chit Plan</p>
<p id="planName" class="text-lg font-bold text-primary"></p>
</div>

<div>
<p class="text-slate-500 text-sm">Monthly Amount</p>
<p id="monthlyAmount" class="text-lg font-bold"></p>
</div>

<div>
<p class="text-slate-500 text-sm">Total Months</p>
<p id="totalMonths" class="text-lg font-bold"></p>
</div>

<div>
<p class="text-slate-500 text-sm">Status</p>
<p class="text-green-600 font-bold">Active</p>
</div>

</div>

</div>


<!-- PROGRESS -->
<div class="bg-white rounded-xl shadow p-6 mb-8">

<h2 class="font-bold mb-3">Chit Progress</h2>

<div class="w-full bg-gray-200 rounded-full h-4">

<div id="progressBar"
class="bg-primary h-4 rounded-full"
style="width:35%">
</div>

</div>

<p class="text-sm text-slate-500 mt-2">
7 / 21 months completed
</p>

</div>


<!-- CHIT SCHEDULE TABLE -->
<div class="bg-white rounded-xl shadow p-6">

<h2 class="text-xl font-bold mb-4">Chit Schedule</h2>

<div class="overflow-x-auto">

<table class="w-full text-sm border">

<thead class="bg-primary text-white">

<tr>
<th class="py-3 px-4">Month</th>
<th class="px-4">Amount</th>
<th class="px-4">Status</th>
</tr>

</thead>

<tbody id="scheduleTable"></tbody>

</table>

</div>

</div>

</div>

<script src="../js/my_chits.js"></script>

</body>
</html>
