<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile | SK Chit Funds</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
theme:{
extend:{
colors:{
primary:"#004a99",
backgroundLight:"#f5f7f8"
}
}
}
}
</script>

</head>

<body class="bg-backgroundLight min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white hidden md:flex flex-col p-6">

<h2 class="text-2xl font-bold mb-10">SK Chit Funds</h2>

<nav class="flex flex-col gap-4 text-sm font-semibold">

<a href="dashboard.html" class="hover:bg-white/20 p-2 rounded">Dashboard</a>

<a href="my_chits.html" class="hover:bg-white/20 p-2 rounded">My Chits</a>

<a href="payments.html" class="hover:bg-white/20 p-2 rounded">Payments</a>

<a href="transaction.html" class="hover:bg-white/20 p-2 rounded">Transactions</a>

<a href="profile.html" class="bg-white text-primary p-2 rounded font-bold">
Profile
</a>

</nav>

<div class="mt-auto">

<button onclick="logout()"
class="w-full bg-white text-primary py-2 rounded-lg font-bold mt-10">
Logout
</button>

</div>

</aside>


<!-- MAIN CONTENT -->
<div class="flex-1 p-6 md:p-10">

<h1 class="text-3xl font-bold text-primary mb-8">
Customer Profile
</h1>

<div class="bg-white rounded-xl shadow p-8 max-w-3xl">

<form id="profileForm" class="grid md:grid-cols-2 gap-6">

<!-- Customer ID -->
<div>
<label class="text-sm font-semibold">Customer ID</label>
<input type="text" id="customerId"
class="w-full border rounded-lg px-4 py-2 mt-1 bg-gray-100"
readonly>
</div>

<!-- Full Name -->
<div>
<label class="text-sm font-semibold">Full Name</label>
<input type="text" id="name"
class="w-full border rounded-lg px-4 py-2 mt-1">
</div>

<!-- Mobile -->
<div>
<label class="text-sm font-semibold">Mobile Number</label>
<input type="text" id="mobile"
class="w-full border rounded-lg px-4 py-2 mt-1">
</div>

<!-- Email -->
<div>
<label class="text-sm font-semibold">Email</label>
<input type="email" id="email"
class="w-full border rounded-lg px-4 py-2 mt-1">
</div>

<!-- Address -->
<div class="md:col-span-2">
<label class="text-sm font-semibold">Address</label>
<textarea id="address"
class="w-full border rounded-lg px-4 py-2 mt-1"></textarea>
</div>

<button type="submit"
class="md:col-span-2 bg-primary text-white py-3 rounded-lg font-bold hover:bg-primary/90">
Update Profile
</button>

</form>

</div>

</div>

<script src="../js/profile.js"></script>

</body>
</html>
