<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | SK Chit Funds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#004a99",
                        backgroundLight: "#f5f7f8"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-backgroundLight min-h-screen flex items-center justify-center p-6">

<div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-10">

    <!-- Heading -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-primary">Create Account</h2>
        <p class="text-slate-500 mt-2 text-sm">
            Join SK Chit Funds and start saving securely
        </p>
    </div>

    <!-- ERROR BLOCK -->
    <div id="errorBlock"
         class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
    </div>

    <!-- Form -->
    <form id="registerForm" class="space-y-6">

        <!-- Full Name -->
        <div>
            <label class="block text-sm font-semibold mb-2">Full Name</label>
            <input type="text" id="name"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="Enter your full name">
        </div>

        <!-- Mobile -->
        <div>
            <label class="block text-sm font-semibold mb-2">Mobile Number</label>
            <input type="tel" id="mobile"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="10-digit mobile number">
        </div>

        <!-- Email -->
        <div>
            <label class="block text-sm font-semibold mb-2">Email</label>
            <input type="email" id="email"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="Enter your email">
        </div>

        <!-- Address -->
        <div>
            <label class="block text-sm font-semibold mb-2">Address</label>
            <textarea id="address"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="Enter your address"></textarea>
        </div>

        <!-- Password -->
        <div>
            <label class="block text-sm font-semibold mb-2">Password</label>
            <div class="relative">
                <input type="password" id="password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                    placeholder="Minimum 6 characters">
                <span onclick="togglePassword()"
                    class="absolute right-4 top-3 cursor-pointer text-sm text-primary font-semibold">
                    Show
                </span>
            </div>
        </div>

        <!-- Confirm Password -->
        <div>
            <label class="block text-sm font-semibold mb-2">Confirm Password</label>
            <input type="password" id="confirmPassword"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="Re-enter password">
        </div>

        <!-- Submit -->
        <button type="submit"
            class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-primary/90 transition">
            Register Account
        </button>

        <div class="text-center mt-4 text-sm">
            Already have an account?
            <a href="login.html" class="text-primary font-bold hover:underline">
                Login Here
            </a>
            <br>
            Go back to Home!
            <a href="index.html" class="text-primary font-bold hover:underline">
                Home page
            </a>
        </div>

    </form>
</div>


<!-- SUCCESS MODAL -->
<div id="successModal"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center">
    <div class="bg-white p-8 rounded-xl text-center max-w-sm w-full">
        <h3 class="text-2xl font-bold text-primary mb-4">
            Registration Successful 🎉
        </h3>
        <p class="text-slate-600 mb-6">
            Your account has been created successfully.
        </p>
        <button onclick="closeModal()"
            class="bg-primary text-white px-6 py-2 rounded-lg">
            OK
        </button>
    </div>
</div>


<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();

    let errorBlock = document.getElementById("errorBlock");
    errorBlock.classList.add("hidden");
    errorBlock.innerHTML = "";

    let errors = [];

    // Check empty fields
    if (!name || !mobile || !email || !password || !confirmPassword) {
        errors.push("All fields must be filled.");
    }

    // Mobile validation
    if (mobile && !/^[0-9]{10}$/.test(mobile)) {
        errors.push("Mobile number must be exactly 10 digits.");
    }

    // Email validation
    if (email && !/^\S+@\S+\.\S+$/.test(email)) {
        errors.push("Enter a valid email address.");
    }

    // Password length
    if (password && password.length < 6) {
        errors.push("Password must be at least 6 characters.");
    }

    // Password match
    if (password && confirmPassword && password !== confirmPassword) {
        errors.push("Passwords do not match.");
    }

    // If errors exist
    if (errors.length > 0) {
        errorBlock.classList.remove("hidden");
        errorBlock.innerHTML = errors.join("<br>");
        return;
    }

    // If valid
    document.getElementById("successModal").classList.remove("hidden");
    document.getElementById("successModal").classList.add("flex");
});

function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function closeModal() {
    document.getElementById("successModal").classList.add("hidden");
}
</script>

</body>
</html>
