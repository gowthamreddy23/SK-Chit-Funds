<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | SK Chit Funds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#004a99",
                        backgroundLight: "#f5f7f8"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-backgroundLight min-h-screen flex items-center justify-center p-6">
<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-10">
    <!-- Heading -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-primary">Customer Login</h2>
        <p class="text-slate-500 mt-2 text-sm">
            Access your chit fund account
        </p>
    </div>
    <!-- ERROR BLOCK -->
    <div id="errorBlock"
         class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
    </div>
    <!-- Login Form -->
    <form id="loginForm" class="space-y-6">
        <!-- Username / Mobile -->
        <div>
            <label class="block text-sm font-semibold mb-2">
                Username / Mobile
            </label>
            <input type="text" id="username"
                class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                placeholder="Enter your username or mobile">
        </div>
        <!-- Password -->
        <div>
            <label class="block text-sm font-semibold mb-2">
                Password
            </label>
            <div class="relative">
                <input type="password" id="password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-primary focus:border-primary"
                    placeholder="Enter your password">
                <span onclick="togglePassword()"
                    class="absolute right-4 top-3 cursor-pointer text-sm text-primary font-semibold">
                    Show
                </span>
            </div>
        </div>
        <!-- Remember -->
        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2">
                <input type="checkbox" class="rounded">
                Remember me
            </label>
            <a href="#" class="text-primary font-semibold hover:underline">
                Forgot password?
            </a>
        </div>
        <!-- Submit -->
        <button type="submit"
            class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-primary/90 transition">
            Login
        </button>

        <div class="text-center mt-4 text-sm">
            Don't have an account?
            <a href="registration.html"
               class="text-primary font-bold hover:underline">
                Register Here
            </a>
            <br>
            Go back to Home!
            <a href="index.html" class="text-primary font-bold hover:underline">
                Home page
            </a>
        </div>

    </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
